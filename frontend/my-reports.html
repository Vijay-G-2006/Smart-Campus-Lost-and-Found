<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My reports - FindIT</title>
    <link rel="stylesheet" href="vendor/bootstrap.min.css">
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to main content</a>

<nav class="navbar navbar-expand-lg navbar-dark navbar-findit">
    <div class="container">
        <a class="navbar-brand" href="index.html"><span class="brand-mark">F</span>FindIT</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav-collapse"
                aria-controls="nav-collapse" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="nav-collapse">
            <ul class="navbar-nav me-auto" id="main-nav"></ul>
        </div>
    </div>
</nav>

<main id="main" class="container py-4">
    <div class="page-header d-flex flex-wrap justify-content-between align-items-center gap-2">
        <div>
            <h1>My reports</h1>
            <p class="lead-muted mb-0">Every lost and found report you created.</p>
        </div>
        <div class="d-flex gap-2">
            <a class="btn btn-outline-primary" href="report-form.html?type=LOST">Report a lost item</a>
            <a class="btn btn-primary" href="report-form.html?type=FOUND">Report a found item</a>
        </div>
    </div>

    <div id="reports-loading" class="loading-state">Loading your reports...</div>
    <div class="table-responsive">
        <table class="table align-middle d-none" id="reports-table">
            <thead>
            <tr>
                <th scope="col">Report</th>
                <th scope="col">Type</th>
                <th scope="col">Category</th>
                <th scope="col">Location</th>
                <th scope="col">Date</th>
                <th scope="col">Status</th>
                <th scope="col" class="text-end">Actions</th>
            </tr>
            </thead>
            <tbody id="reports-body"></tbody>
        </table>
    </div>
    <div id="reports-empty" class="d-none"></div>
    <div id="reports-pagination" class="mt-4"></div>
</main>

<footer class="footer-findit">
    <div class="container d-flex flex-wrap justify-content-between gap-2">
        <span>FindIT - Smart Campus Lost and Found Management System</span>
        <span><a href="help.html">Help &amp; privacy</a></span>
    </div>
</footer>

<script src="vendor/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/my-reports.js"></script>
</body>
</html>
