# ---------------------------------------------------------------------------
# Gradle settings for the FindIT project.
#
# The default heap of the Gradle daemon is larger than many student laptops.
# 900 MB is enough for this project and keeps the build responsive.
# ---------------------------------------------------------------------------
org.gradle.jvmargs=-Xmx900m -XX:MaxMetaspaceSize=384m
org.gradle.daemon=true
org.gradle.parallel=false
org.gradle.caching=true

# Run the tests in a single JVM - the test suite is small and this keeps the
# memory footprint low.
org.gradle.workers.max=1
