spring:
  application:
    name: findit
  profiles:
    default: local
  config:
    # Optional local environment file. Values are read as .properties, so a '#'
    # starts a comment - do not use '#' inside a secret value.
    import: "optional:file:.env[.properties]"
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 6MB
  web:
    resources:
      cache:
        period: 0

server:
  port: ${PORT:8080}
  servlet:
    session:
      timeout: 60m
      cookie:
        name: JSESSIONID
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
  compression:
    enabled: true

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  storage:
    type: ${APP_STORAGE_TYPE:local}
    local-dir: ${APP_STORAGE_LOCAL_DIR:local-data/images}
    container: ${AZURE_STORAGE_CONTAINER:findit-item-images}
    connection-string: ${AZURE_STORAGE_CONNECTION_STRING:}
    account-name: ${AZURE_STORAGE_ACCOUNT_NAME:}
    max-file-size-bytes: 5242880
    allowed-content-types:
      - image/jpeg
      - image/png
      - image/webp
      - image/gif
  seed:
    enabled: false
    admin-email: ${ADMIN_SEED_EMAIL:}
    admin-password: ${ADMIN_SEED_PASSWORD:}
    admin-display-name: FindIT Administrator
    demo-user-password: ${DEMO_USER_PASSWORD:}
    demo-data: true
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}
  security:
    max-login-attempts: 10
    rate-limit-window-seconds: 900
    max-claims-per-hour: 20

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    com.findit: INFO
    org.springframework.security: WARN
