# ---------------------------------------------------------------------------
# Local development profile - no Azure credentials required.
#
#   * H2 file database in ./local-data (git ignored)
#   * images stored in ./local-data/images (outside the static resource paths)
#   * synthetic demo data seeded on the first start
# ---------------------------------------------------------------------------
spring:
  datasource:
    url: jdbc:h2:file:./local-data/findit;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    placeholders:
      id_identity: GENERATED BY DEFAULT AS IDENTITY
      boolean_type: BOOLEAN
      bool_true: "TRUE"
      bool_false: "FALSE"
      datetime_type: TIMESTAMP

app:
  storage:
    type: local
    local-dir: local-data/images
  seed:
    enabled: true
    admin-email: ${ADMIN_SEED_EMAIL:admin@findit.local}
    admin-password: ${ADMIN_SEED_PASSWORD:}
    admin-display-name: FindIT Administrator
    demo-user-password: ${DEMO_USER_PASSWORD:FindItDemo2024!}
    demo-data: true

logging:
  level:
    com.findit: INFO
